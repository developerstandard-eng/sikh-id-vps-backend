<!doctype html>
<html>
<body style="margin:0;padding:0;background:#f4f4f2;font-family:Arial,Helvetica,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background:#f4f4f2;padding:24px 0;">
    <tr><td align="center">
      <table width="480" cellpadding="0" cellspacing="0" style="background:#ffffff;border-radius:8px;overflow:hidden;">
        <tr><td style="background:#0d1b3d;padding:20px 32px;">
          <span style="color:#ffffff;font-size:18px;font-weight:bold;">THE SIKH <span style="color:#f5821f;">ID</span></span>
        </td></tr>
        <tr><td style="padding:32px;">
          <p style="font-size:16px;color:#0d1b3d;margin:0 0 12px;">Hi {{full_name}},</p>
          <h2 style="font-size:20px;color:#0d1b3d;margin:0 0 12px;">{{headline}}</h2>
          <p style="font-size:14px;color:#444;line-height:1.6;margin:0 0 24px;">{{body_copy}}</p>
          <a href="{{cta_url}}" style="display:inline-block;background:#f5821f;color:#ffffff;text-decoration:none;padding:12px 24px;border-radius:6px;font-size:14px;font-weight:bold;">{{cta_label}}</a>
          <p style="font-size:12px;color:#999;margin:32px 0 0;">Your Sikh ID is {{completion_pct}}% complete.</p>
        </td></tr>
        <tr><td style="background:#f4f4f2;padding:16px 32px;">
          <a href="{{unsubscribe_url}}" style="font-size:11px;color:#999;">Manage email preferences</a>
        </td></tr>
      </table>
    </td></tr>
  </table>
</body>
</html>
